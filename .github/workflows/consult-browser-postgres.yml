permissions:
  contents: read

jobs:
  history-preservation:
    name: Consult history preservation
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unchanged isolated history tests and route wiring check
        run: python -B tests/test_consult_history_merge.py

  synthetic-acceptance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PMAI_SYNTHETIC_ACCEPTANCE: PR26
      PMAI_ACCEPTANCE_OUT: ${{ github.workspace }}/acceptance-results
      DATABASE_URL: postgresql://pmai_acceptance@127.0.0.1:55432/pmai_acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind frozen M7 through CW-B13 and approved CW-B14 increment
        run: |
          set -euo pipefail
          python scripts/validate_clinical_followup_plans_cw_b14.py > "$RUNNER_TEMP/cwb14-scope.json"
          mkdir -p acceptance-results
          cp "$RUNNER_TEMP/cwb14-scope.json" acceptance-results/cwb14-scope.json
          python - <<'PY_SCOPE'
          import json
          cwb13 = json.load(open('acceptance-results/cwb14-scope.json'))['frozen_cwb13']
          open('acceptance-results/cwb13-scope.json','w').write(json.dumps(cwb13,indent=2))
          new_increment = cwb13['frozen_cwb12']
          open('acceptance-results/cwb12-scope.json','w').write(json.dumps(new_increment,indent=2))
          increment = new_increment['frozen_cwb11']
          open('acceptance-results/cwb11-scope.json','w').write(json.dumps(increment,indent=2))
          current = increment['frozen_cwb10']
          open('acceptance-results/cwb10-scope.json','w').write(json.dumps(current,indent=2))
          cwb9 = current['frozen_cwb9']
          open('acceptance-results/cwb9-scope.json','w').write(json.dumps(cwb9,indent=2))
          cwb8 = cwb9['frozen_cwb8']
          open('acceptance-results/cwb8-scope.json','w').write(json.dumps(cwb8,indent=2))
          scope = cwb8['frozen_cwb7']
          open('acceptance-results/cwb7-scope.json','w').write(json.dumps(scope,indent=2))
          open('acceptance-results/cwb6-scope.json','w').write(json.dumps(scope['frozen_cwb6'],indent=2))
          PY_SCOPE
          baseline=793894523be602bd8da265f8f7e8e63e417027a7
          git merge-base --is-ancestor "$baseline" HEAD
          test "$(git rev-parse "$baseline^{tree}")" = 63bd051e6e99f0719f474e0ecf38fc70fbc21f42
          python - <<'PY'
          import json, subprocess
          allowed = {
              'knowledge-base/companion/intake/diarrhea.json', 'backend/diarrhea_intake.py', 'backend/main.py',
              'frontend/src/components/DiarrheaIntake.jsx', 'frontend/src/diarrheaIntakeState.js', 'frontend/src/App.jsx',
              'frontend/src/consultDraft.js', 'tests/test_diarrhea_intake.py', 'tests/test_consult_first_save.py',
              'tests/test_clinical_doc_lifecycle.py', 'frontend/tests/diarrhea-intake.test.jsx',
              'frontend/tests/consult-draft.test.jsx', 'frontend/tests/manual-case-create.test.jsx',
              'frontend/tests/run-consult-update-review.mjs', 'tests/acceptance/postgres_checks.py',
              'tests/acceptance/diarrhea_intake_checks.cjs', '.github/workflows/consult-browser-postgres.yml',
              'docs/clinical_docs/VISIT_MILESTONE_M7.md',
          }
          m7 = '99a4f25ee7267f57414d336bd836f86b27cbbcd8'
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', m7, 'HEAD'])
          assert subprocess.check_output(['git', 'rev-parse', m7 + '^{tree}'], text=True).strip() == '0021fe336ce6ebc8cfc2875474c1a4ef5515408a'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '793894523be602bd8da265f8f7e8e63e417027a7', m7], text=True).splitlines())
          assert 0 < len(changed) <= 18 and changed <= allowed, sorted(changed - allowed)
          open('acceptance-results/m7-scope.json', 'w').write(json.dumps({'changed': sorted(changed), 'allowed': sorted(allowed)}, indent=2))
          supplement_allowed = {
              'backend/clinical_docs_api.py', 'frontend/src/components/ClinicalDocReview.jsx',
              'frontend/tests/case-detail-documents.test.jsx', 'tests/test_clinical_doc_lifecycle.py',
              'scripts/validate_outpatient_document_templates.py',
