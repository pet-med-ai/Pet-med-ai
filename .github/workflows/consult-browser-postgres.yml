          "$RUNNER_TEMP/pmai-render-startup/bin/python" -m pip install -r backend/requirements.txt 2>&1 | tee acceptance-results/render-startup-install.log
          "$RUNNER_TEMP/pmai-render-startup/bin/python" -m pip check 2>&1 | tee acceptance-results/render-startup-pip-check.log
