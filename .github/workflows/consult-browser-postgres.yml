              '.github/workflows/consult-browser-postgres.yml',
          }
          identity = '25bc2b10db8caffbe31dafc7a7bc4cebdea62bdc'
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', identity, 'HEAD'])
          assert subprocess.check_output(['git', 'rev-parse', identity + '^{tree}'], text=True).strip() == 'd109805e9ff66e74863c74a8d29b02f7119749ed'
          supplement = set(subprocess.check_output(['git', 'diff', '--name-only', m7, identity], text=True).splitlines())
          assert 0 < len(supplement) <= 8 and supplement <= supplement_allowed, sorted(supplement - supplement_allowed)
          open('acceptance-results/outpatient-identity-scope.json', 'w').write(json.dumps({'baseline': m7, 'changed': sorted(supplement), 'allowed': sorted(supplement_allowed)}, indent=2))
          b1_allowed = {'tests/test_diarrhea_intake.py', 'backend/chief_complaint_intake.py', 'frontend/tests/run-consult-update-review.mjs', 'frontend/src/chiefComplaintIntakeState.js', 'tests/test_consult_first_save.py', 'knowledge-base/companion/intake/cough_breathing.json', 'backend/main.py', 'tests/acceptance/postgres_checks.py', '.github/workflows/consult-browser-postgres.yml', 'frontend/tests/diarrhea-intake.test.jsx', 'knowledge-base/companion/intake/appetite_weight.json', 'tests/test_consult_update_preview.py', 'frontend/tests/consult-update-review.test.jsx', 'knowledge-base/companion/intake/polyuria_polydipsia.json', 'tests/test_chief_complaint_intake.py', 'tests/acceptance/chief_complaint_intake_checks.cjs', 'tests/test_manual_case_create.py', 'frontend/tests/chief-complaint-intake.test.jsx', 'frontend/tests/manual-case-create.test.jsx', 'frontend/tests/consult-draft.test.jsx', 'frontend/tests/consult-first-save.test.jsx', 'frontend/src/App.jsx', 'frontend/src/components/DiarrheaIntake.jsx', 'frontend/src/diarrheaIntakeState.js', 'frontend/src/consultDraft.js', 'tests/acceptance/diarrhea_intake_checks.cjs', 'tests/test_clinical_doc_lifecycle.py', 'frontend/src/components/ChiefComplaintIntake.jsx', 'backend/diarrhea_intake.py', 'docs/clinical_docs/INTAKE_BATCH_B1.md'}
          b1 = '482b484071b00a28e96cd81b1ead71712bd84354'
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', b1, 'HEAD'])
          assert subprocess.check_output(['git', 'rev-parse', b1 + '^{tree}'], text=True).strip() == 'c2d804f635262b843997e3fd0ab6ffd071bcd21a'
          b1_changed = set(subprocess.check_output(['git', 'diff', '--name-only', identity, b1], text=True).splitlines())
          assert 0 < len(b1_changed) <= 30 and b1_changed <= b1_allowed, sorted(b1_changed - b1_allowed)
          open('acceptance-results/b1-scope.json', 'w').write(json.dumps({'baseline': identity, 'changed': sorted(b1_changed), 'allowed': sorted(b1_allowed)}, indent=2))
          b2_allowed = {'backend/main.py', 'knowledge-base/companion/intake/lameness_pain.json', 'frontend/tests/chief-complaint-intake.test.jsx', 'backend/chief_complaint_intake.py', 'frontend/src/consultDraft.js', 'frontend/tests/consult-draft.test.jsx', 'tests/acceptance/chief_complaint_intake_checks.cjs', 'knowledge-base/companion/intake/urinary_abnormality.json', '.github/workflows/consult-browser-postgres.yml', 'tests/test_consult_first_save.py', 'tests/test_clinical_doc_lifecycle.py', 'tests/acceptance/postgres_checks.py', 'frontend/src/chiefComplaintIntakeState.js', 'docs/clinical_docs/INTAKE_BATCH_B2.md', 'frontend/src/components/ChiefComplaintIntake.jsx', 'knowledge-base/companion/intake/syncope_seizure.json', 'frontend/src/App.jsx', 'frontend/tests/consult-first-save.test.jsx', 'tests/test_chief_complaint_intake.py', 'knowledge-base/companion/intake/itching_hair_loss.json'}
          b2 = 'e584f8ec8646cfbdcad6d0ef9a3fadaa465ffa02'
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', b2, 'HEAD'])
          assert subprocess.check_output(['git', 'rev-parse', b2 + '^{tree}'], text=True).strip() == 'd819cdd04f504c9ac79f7e9bc7e0feef3b90e6af'
          b2_changed = set(subprocess.check_output(['git', 'diff', '--name-only', b1, b2], text=True).splitlines())
          assert 0 < len(b2_changed) <= 20 and b2_changed <= b2_allowed, sorted(b2_changed - b2_allowed)
          open('acceptance-results/b2-scope.json', 'w').write(json.dumps({'baseline': b1, 'changed': sorted(b2_changed), 'allowed': sorted(b2_allowed)}, indent=2))
          b3_allowed = {'knowledge-base/companion/intake/senior_screening.json', 'docs/clinical_docs/INTAKE_BATCH_B3.md', '.github/workflows/consult-browser-postgres.yml', 'frontend/src/chiefComplaintIntakeState.js', 'backend/chief_complaint_intake.py', 'knowledge-base/companion/intake/fever_lethargy.json', 'frontend/src/components/ChiefComplaintIntake.jsx', 'tests/test_chief_complaint_intake.py', 'tests/acceptance/chief_complaint_intake_checks.cjs', 'frontend/tests/chief-complaint-intake.test.jsx'}
          b3 = '59dcb643510e75d76efd0147545565a0fe327e3c'
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', b3, 'HEAD'])
          assert subprocess.check_output(['git', 'rev-parse', b3 + '^{tree}'], text=True).strip() == 'a6a28084a251b38abd4b2e6a2c6348e33a846582'
          b3_changed = set(subprocess.check_output(['git', 'diff', '--name-only', b2, b3], text=True).splitlines())
          assert 0 < len(b3_changed) <= 10 and b3_changed <= b3_allowed, sorted(b3_changed - b3_allowed)
          open('acceptance-results/b3-scope.json', 'w').write(json.dumps({'baseline': b2, 'changed': sorted(b3_changed), 'allowed': sorted(b3_allowed)}, indent=2))
          b4_allowed = {'frontend/src/App.jsx', 'frontend/tests/consult-evidence.test.jsx', 'frontend/tests/run-consult-update-review.mjs', 'backend/orchestrator.py', 'tests/acceptance/evidence_checks.cjs', 'tests/acceptance/postgres_checks.py', 'frontend/src/components/ConsultEvidence.jsx', 'backend/risk_engine.py', 'backend/feature_engine.py', '.github/workflows/consult-browser-postgres.yml', 'backend/dynamic_consult.py', 'backend/clinical_evidence.py', 'tests/test_clinical_evidence.py', 'tests/test_consult_evidence.py', 'backend/diagnosis_engine.py', 'backend/companion_animal_knowledge.py', 'backend/main.py', 'docs/clinical_docs/CONSULT_EVIDENCE_B4.md'}
          b4 = '8109a629b6b7159873ff6723c7833a1b26656117'
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', b4, 'HEAD'])
          assert subprocess.check_output(['git', 'rev-parse', b4 + '^{tree}'], text=True).strip() == '11c5a93face82e578caddba398160d15d1736add'
          b4_changed = set(subprocess.check_output(['git', 'diff', '--name-only', b3, b4], text=True).splitlines())
