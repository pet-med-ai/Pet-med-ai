name: Consult browser and PostgreSQL acceptance

on:
  pull_request:
    paths:
      - 'tests/acceptance/**'
      - 'backend/**'
      - '.github/workflows/consult-browser-postgres.yml'
      - 'frontend/src/pages/CaseDetail.jsx'
      - 'frontend/src/App.jsx'
      - 'frontend/src/consultDraft.js'
      - 'frontend/src/useConsultDraft.js'
      - 'frontend/src/components/**'

permissions:
  contents: read

jobs:
  synthetic-acceptance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PMAI_SYNTHETIC_ACCEPTANCE: PR26
      PMAI_ACCEPTANCE_OUT: ${{ github.workspace }}/acceptance-results
      DATABASE_URL: postgresql://pmai_acceptance@127.0.0.1:55432/pmai_acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact doctor addendum application and unchanged baseline
        run: |
          mkdir -p acceptance-results
          git rev-parse HEAD > acceptance-results/test-commit.txt
          git diff --exit-code b7bd032fb22627fa2f50e9757d0ad0220fb11d4c HEAD -- backend frontend knowledge-base requirements.txt ':(exclude)backend/main.py' ':(exclude)frontend/src/App.jsx' ':(exclude)frontend/src/components/ConsultUpdateReview.jsx' ':(exclude)frontend/src/consultDraft.js' ':(exclude)frontend/tests/consult-update-review.test.jsx' ':(exclude)frontend/tests/consult-draft.test.jsx' ':(exclude)tests/test_consult_update_preview.py'
          test "$(git rev-parse HEAD:backend/main.py)" = "ec4387db3e0ef1b18ba288009614bd7430d80517"
          test "$(git rev-parse HEAD:frontend/src/App.jsx)" = "116a95e6979a546ece440aec032988528382cdd6"
          test "$(git rev-parse HEAD:frontend/src/components/ConsultUpdateReview.jsx)" = "0a1cc1614c6eed397345a5f8b6cf6b0996cad557"
          test "$(git rev-parse HEAD:frontend/src/consultDraft.js)" = "d68e90fb168e77494410ddcd2f6fdf508271942c"
          test "$(git rev-parse HEAD:frontend/tests/consult-update-review.test.jsx)" = "2e8d8adbf7080739c1e6660fb5c0dfbc8e9f1737"
          test "$(git rev-parse HEAD:frontend/tests/consult-draft.test.jsx)" = "2dc4bf326a82409f823b58680dbf01fd26159b9c"
          test "$(git rev-parse HEAD:tests/test_consult_update_preview.py)" = "8522383b377233c245696228a00586e1cdfcb53e"
          test "$(git rev-parse HEAD:tests/test_consult_history_merge.py)" = "495223a5a60c9a2027251f7adfdc6e8141f36084"
          git rev-parse HEAD > acceptance-results/application-commit.txt
          git rev-parse b7bd032fb22627fa2f50e9757d0ad0220fb11d4c > acceptance-results/application-baseline.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt -r backend/requirements.txt
          npm install --prefix frontend
          npm install --prefix "$RUNNER_TEMP/pmai-browser-deps" --no-package-lock @playwright/test@1.55.0
          "$RUNNER_TEMP/pmai-browser-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start fresh native PostgreSQL (no Docker)
        run: |
          test -x /usr/lib/postgresql/16/bin/initdb
          /usr/lib/postgresql/16/bin/initdb -D "$RUNNER_TEMP/pmai-pgdata" -U pmai_acceptance --auth=trust --encoding=UTF8 --no-locale
          mkdir "$RUNNER_TEMP/pmai-pgsocket"
          /usr/lib/postgresql/16/bin/pg_ctl -D "$RUNNER_TEMP/pmai-pgdata" -l "$PMAI_ACCEPTANCE_OUT/postgres.log" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP/pmai-pgsocket" -w start
          /usr/lib/postgresql/16/bin/createdb -h 127.0.0.1 -p 55432 -U pmai_acceptance pmai_acceptance
      - name: PostgreSQL real routes and concurrent transactions
        run: |
          set -o pipefail
          python tests/acceptance/postgres_checks.py 2>&1 | tee acceptance-results/postgres-checks.log
          python tests/acceptance/postgres_checks.py --readback 2>&1 | tee acceptance-results/restart-readback.log
      - name: Build and serve exact application locally
        env:
          VITE_API_BASE: http://127.0.0.1:18026
        run: |
          npm --prefix frontend run build
          python tests/acceptance/fixture.py > acceptance-results/backend.log 2>&1 &
          echo "$!" > acceptance-results/backend.pid
          frontend/node_modules/.bin/vite preview frontend --host 127.0.0.1 --port 5173 --strictPort > acceptance-results/frontend.log 2>&1 &
          echo "$!" > acceptance-results/frontend.pid
          python - <<'PY'
          import time, urllib.request
          for url in ['http://127.0.0.1:18026/healthz', 'http://127.0.0.1:5173/']:
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(url, timeout=1) as response:
                          assert response.status == 200
                      break
                  except Exception:
                      if attempt == 29: raise
                      time.sleep(1)
          PY
      - name: Real Chromium consultation save and readback
        run: |
          set -o pipefail
          NODE_PATH="$RUNNER_TEMP/pmai-browser-deps/node_modules" node tests/acceptance/browser_checks.cjs 2>&1 | tee acceptance-results/browser-checks.log
      - name: Real Chromium current-tab draft recovery
        run: |
          set -o pipefail
          NODE_PATH="$RUNNER_TEMP/pmai-browser-deps/node_modules" node tests/acceptance/draft_checks.cjs 2>&1 | tee acceptance-results/draft-checks.log
      - name: Real Chromium doctor history addendum
        run: |
          set -o pipefail
          NODE_PATH="$RUNNER_TEMP/pmai-browser-deps/node_modules" node tests/acceptance/addendum_checks.cjs 2>&1 | tee acceptance-results/addendum-checks.log
      - name: Stop test processes
        if: always()
        run: |
          for file in acceptance-results/backend.pid acceptance-results/frontend.pid; do
            if test -f "$file"; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
          if test -f "$RUNNER_TEMP/pmai-pgdata/postmaster.pid"; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "$RUNNER_TEMP/pmai-pgdata" -m fast -w stop
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consult-browser-postgres-${{ github.event.pull_request.head.sha }}
          path: acceptance-results/
          retention-days: 14
