name: Consult update preview

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/src/components/ConsultUpdateReview.jsx'
      - 'frontend/src/components/ConsultSaveReview.jsx'
      - 'frontend/src/App.jsx'
      - 'frontend/src/api.ts'
      - 'frontend/src/pages/CaseEditorLite.jsx'
      - 'frontend/src/components/CaseEditReview.jsx'
      - 'frontend/tests/**'
      - 'frontend/package.json'
      - 'tests/test_consult_update_preview.py'
      - 'tests/test_consult_first_save.py'
      - '.github/workflows/consult-update-preview.yml'

permissions:
  contents: read

jobs:
  update-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt -r backend/requirements.txt
      - name: Verify real routes with synthetic SQLite and JWT
        run: |
          python tests/test_consult_update_preview.py
          python tests/test_consult_first_save.py

  update-review-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Verify React update review states
        working-directory: frontend
        run: npm run test:consult-update
